kind = "web"
previewPath = "/"
title = "EOD Management Portal"
version = "1.0.0"
id = "artifacts/eod-portal"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23881

[services.development]
run = "pnpm --filter @workspace/eod-portal run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/eod-portal", "run", "build" ]
publicDir = "artifacts/eod-portal/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23881"
BASE_PATH = "/"
